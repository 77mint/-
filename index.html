<script>
(function(){
var TB=document.querySelector('.tab-bar');
const S=[];let aS=null,aCh=null,vP=null,cT='home',npI=[],saved=[],rTo=null,dmQ=null;
let U={name:'用户',id:'ID: '+(100000+Math.floor(Math.random()*900000)),avatar:null},wR={};
const npc={name:'沐白',avatar:null,bio:'山有木兮木有枝',roles:[{name:'好友',color:'#22b8cf'}],id:'_npc1',unread:2,lastMsg:'在吗？想聊聊',time:'12:30',posts:[{title:'今天的天空很好看',content:'分享一下心情',time:'10:15'},{title:'读了一本好书',content:'推荐给大家',time:'昨天'}],msgs:[{w:'them',text:'你好呀',time:'12:28'},{w:'them',text:'在吗？想聊聊',time:'12:30'}]};
const $=id=>document.getElementById(id),In=n=>n.slice(0,2).toUpperCase(),Nm=()=>{const d=new Date();return d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0')},Uid=()=>'_'+Math.random().toString(36).slice(2,9);
function rF(f,cb){const r=new FileReader();r.onload=e=>cb(e.target.result);r.readAsDataURL(f)}
function gWR(){let o=[];S.forEach(s=>{if(!s.roles)return;(wR[s.id]||[]).forEach(rid=>{const r=s.roles.find(x=>x.id===rid);if(r)o.push(r)})});return o}
function RB(rd){if(!rd||!rd.length)return '';return rd.map(r=>'<span class="role-badge" style="background:'+r.color+'20;color:'+r.color+'">'+r.name+'</span>').join('')}
function SP(t){return t.replace(/\|\|(.+?)\|\|/g,'<span class="spoiler">$1</span>')}
document.addEventListener('click',e=>{if(e.target.classList.contains('spoiler')){e.target.classList.toggle('revealed');e.stopPropagation()}});
function isSv(s,p){return saved.some(x=>x.s===s&&x.p===p)}
function tgSv(s,p,t){if(isSv(s,p))saved=saved.filter(x=>!(x.s===s&&x.p===p));else saved.push({s,p,type:t})}
function gS(){return S.find(x=>x.id===aS)}
function gC(){const s=gS();return s?s.channels.find(c=>c.id===aCh):null}
// profile menu
let pmO=false;function cPM(){pmO=false;$('profileMenu').classList.remove('show');$('pmOverlay').classList.remove('show')}
$('chatDots').addEventListener('click',()=>{pmO=!pmO;$('profileMenu').classList.toggle('show',pmO);$('pmOverlay').classList.toggle('show',pmO)});
$('pmOverlay').addEventListener('click',cPM);$('pmEditProfile').addEventListener('click',()=>{cPM();oPM()});
let pAv=null,tW={};
function oPM(){$('modalProfile').classList.add('show');$('psNameInput').value=U.name;pAv=null;if(U.avatar){$('psAvatarImg').src=U.avatar;$('psAvatarImg').style.display='block';$('psPlaceholder').style.display='none'}else{$('psAvatarImg').style.display='none';$('psPlaceholder').style.display='flex'}tW=JSON.parse(JSON.stringify(wR));rpR()}
function rpR(){const l=$('psRoleList');l.innerHTML='';let h=false;S.forEach(s=>{if(!s.roles||!s.roles.length)return;h=true;const w=tW[s.id]||[];const lb=document.createElement('div');lb.style.cssText='width:100%;font-size:10px;color:#aaa;margin-top:'+(l.children.length?'6px':'0');lb.textContent=s.name;l.appendChild(lb);s.roles.forEach(r=>{const c=document.createElement('div');c.className='ps-role-chip '+(w.includes(r.id)?'on':'off');c.style.color=r.color;c.style.background=r.color+'15';c.innerHTML=r.name+(w.includes(r.id)?' <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>':'');c.addEventListener('click',()=>{if(!tW[s.id])tW[s.id]=[];if(tW[s.id].includes(r.id))tW[s.id]=tW[s.id].filter(x=>x!==r.id);else tW[s.id].push(r.id);rpR()});l.appendChild(c)})});$('psRolesSection').style.display=h?'block':'none'}
$('psAvatar').addEventListener('click',()=>$('psFileInput').click());
$('psFileInput').addEventListener('change',function(){if(this.files[0])rF(this.files[0],u=>{pAv=u;$('psAvatarImg').src=u;$('psAvatarImg').style.display='block';$('psPlaceholder').style.display='none'})});
$('btnCancelProfile').addEventListener('click',()=>$('modalProfile').classList.remove('show'));
$('modalProfile').addEventListener('click',e=>{if(e.target===$('modalProfile'))$('modalProfile').classList.remove('show')});
$('btnSaveProfile').addEventListener('click',()=>{const n=$('psNameInput').value.trim();if(!n)return;U.name=n;if(pAv)U.avatar=pAv;wR=JSON.parse(JSON.stringify(tW));$('modalProfile').classList.remove('show')});
// friends
function rFr(){const fl=$('friendList');fl.innerHTML='';const el=document.createElement('div');el.className='friend-item';el.innerHTML='<div class="fi-avatar-wrap"><div class="fi-avatar">'+In(npc.name)+'</div>'+(npc.unread?'<div class="fi-unread">'+npc.unread+'</div>':'')+'</div><div class="fi-info"><div class="fi-name">'+npc.name+' '+RB(npc.roles)+'</div><div class="fi-msg">'+npc.lastMsg+'</div></div><div class="fi-time">'+npc.time+'</div>';el.addEventListener('click',()=>oDm());fl.appendChild(el)}
rFr();
// DM open
function oDm(){npc.unread=0;rFr();$('chatListView').style.display='none';$('dmView').classList.add('show');$('dmName').textContent=npc.name;TB.style.display='none';rDm()}
// DM render - capsule, no name/time under bubble, both sides have avatar, tight spacing
function rDm(){
const c=$('dmMsgs');c.innerHTML='';let lw=null,lt='';
npc.msgs.forEach((m,i)=>{
  // time divider only when time changes
  if(m.time!==lt){const td=document.createElement('div');td.className='dm-time-div';td.textContent=m.time;c.appendChild(td);lt=m.time;lw=null}
  const isFirst=m.w!==lw;
  lw=m.w;
  const row=document.createElement('div');
  row.className='dm-row '+m.w;
  // avatar for both sides, spacer if not first in group
  let avContent='';
  if(m.w==='them') avContent=In(npc.name);
  else avContent=U.avatar?'<img src="'+U.avatar+'">':In(U.name);
  let av='';
  if(isFirst) av='<div class="dm-av"><div class="dm-av-img">'+avContent+'</div></div>';
  else av='<div class="dm-av"><div class="dm-av-spacer"></div></div>';
  // quote ref above bubble
  let qh='';
  if(m.q) qh='<div class="dm-quote-ref">↩ '+m.q.slice(0,30)+'</div>';
  // just the capsule, no name/time below
  row.innerHTML=av+'<div>'+qh+'<div class="dm-capsule">'+m.text+'</div></div>';
  // swipe left to quote (them messages only)
  if(m.w==='them'){
    let sx=0;
    row.addEventListener('touchstart',e=>{sx=e.touches[0].clientX});
    row.addEventListener('touchend',e=>{
      if(sx-e.changedTouches[0].clientX>50){
        dmQ=m.text;
        $('dqbText').textContent='回复: '+m.text.slice(0,30);
        $('dmQuoteBar').classList.add('show');
        $('dmInput').focus();
      }
    });
  }
  c.appendChild(row);
});
c.scrollTop=c.scrollHeight;
}
// quote bar
$('dqbClose').addEventListener('click',()=>{dmQ=null;$('dmQuoteBar').classList.remove('show')});
// back to friends - show tab bar
$('btnBackToFriends').addEventListener('click',()=>{$('dmView').classList.remove('show');$('chatListView').style.display='flex';TB.style.display='flex'});
// send dm
$('btnDmSend').addEventListener('click',sDm);$('dmInput').addEventListener('keydown',e=>{if(e.key==='Enter')sDm()});
function sDm(){const t=$('dmInput').value.trim();if(!t)return;const m={w:'me',text:t,time:Nm()};if(dmQ){m.q=dmQ;dmQ=null;$('dmQuoteBar').classList.remove('show')}npc.msgs.push(m);npc.lastMsg=t;npc.time=Nm();$('dmInput').value='';rDm();rFr();
setTimeout(()=>{const rp=['嗯嗯','好的~','哈哈哈','然后呢？','有道理','我也觉得！','真的吗','太好了'];npc.msgs.push({w:'them',text:rp[Math.floor(Math.random()*rp.length)],time:Nm()});npc.lastMsg=npc.msgs[npc.msgs.length-1].text;npc.time=Nm();rDm();rFr()},800+Math.random()*1200)}
// user profile - hide tab bar
$('dmDots').addEventListener('click',()=>{$('dmView').classList.remove('show');$('userProfile').classList.add('show');TB.style.display='none';$('upBody').innerHTML='<div class="up-banner"><div class="up-avatar-wrap"><div class="up-av">'+In(npc.name)+'</div></div></div><div class="up-info"><div class="up-name">'+npc.name+'</div><div class="up-bio">'+npc.bio+'</div><div class="up-roles">'+RB(npc.roles)+'</div><div class="up-actions"><button class="up-msg" id="upMsg">发消息</button></div></div><div class="up-posts-title">帖子</div>'+npc.posts.map(p=>'<div class="up-post-item"><div class="upi-title">'+p.title+'</div><div class="upi-preview">'+p.content+'</div><div class="upi-time">'+p.time+'</div></div>').join('');$('upMsg').addEventListener('click',()=>{$('userProfile').classList.remove('show');$('dmView').classList.add('show')})});
$('btnBackToDm').addEventListener('click',()=>{$('userProfile').classList.remove('show');$('dmView').classList.add('show')});
// sidebar
function rSb(){const sb=$('sidebar');sb.querySelectorAll('.server-icon:not(.add)').forEach(e=>e.remove());const dv=sb.querySelector('.server-divider');S.forEach(s=>{const el=document.createElement('div');el.className='server-icon'+(s.id===aS?' active':'');el.title=s.name;if(s.avatar)el.innerHTML='<img src="'+s.avatar+'">';else el.innerHTML='<span class="si-text">'+In(s.name)+'</span>';el.addEventListener('click',()=>selS(s.id));dv.after(el)})}
$('sidebarSearch').addEventListener('click',()=>{$('searchOverlay').classList.add('show');$('searchServerInput').value='';$('searchResults').innerHTML='';$('ssHint').style.display='block'});
